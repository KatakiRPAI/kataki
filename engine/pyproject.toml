[project]
name = "kataki"
version = "0.0.1"
description = "Kataki RPAI engine: headless AI roleplay harness"
requires-python = ">=3.12"
# numpy, model2vec, keyring are added by the tasks that first use them
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx2>=2.13"]

[project.scripts]
kataki = "kataki.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kataki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",  # our own warnings fail the build
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",  # inside starlette.testclient
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

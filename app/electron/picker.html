<!doctype html>
<!-- Which profile? Shown by the shell before any library opens: when Kataki is told to ask at
     startup, or when the last profile has a PIN (docs/specs/2026-10-02-profiles-and-accounts.md P4).
     It stands alone (no engine is running yet), so its few words live here, like the shell's dialogs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Kataki</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1230; color: #e9eeff; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { width: 340px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  button, input { font: inherit; color: inherit; border-radius: 12px; border: 1px solid #2b3766; background: #131c44; padding: 12px 14px; width: 100%; text-align: start; }
  button { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  button:hover, button:focus-visible { border-color: #7f9cff; outline: none; }
  button[aria-pressed="true"] { border-color: #7f9cff; background: #1a2658; }
  button.go { justify-content: center; background: #3d5bf0; border-color: #3d5bf0; font-weight: 600; }
  button.go:disabled { opacity: 0.5; cursor: default; }
  input:focus-visible { border-color: #7f9cff; outline: none; }
  .lock { color: #9aa6d8; font-size: 13px; }
  p { margin: 0; color: #9aa6d8; font-size: 13px; }
  #wrong { color: #ff9d9d; min-height: 18px; }
</style>
</head>
<body>
<main>
  <h1>Who is writing?</h1>
  <div id="list" role="group" aria-label="Profiles" style="display: flex; flex-direction: column; gap: 8px"></div>
  <form id="pin" hidden>
    <label for="code" style="display: block; margin-bottom: 6px">PIN</label>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <p id="wrong" role="alert"></p>
    <button class="go" type="submit" id="open" disabled>Open</button>
    <p>A PIN keeps a profile out of casual reach on this computer. It does not lock the files themselves.</p>
  </form>
</main>
<script>
  const list = document.getElementById('list'), form = document.getElementById('pin'), code = document.getElementById('code'), open = document.getElementById('open'), wrong = document.getElementById('wrong')
  let picked
  const go = async (id, pin) => {
    open.disabled = true
    if (!(await window.picker.choose(id, pin))) { wrong.textContent = 'That is not the PIN.'; code.value = ''; code.focus() }
  }
  window.picker.list().then(({ last, profiles }) => {
    for (const p of profiles) {
      const b = document.createElement('button')
      b.type = 'button'
      const name = document.createElement('span'); name.textContent = p.name; b.append(name)
      if (p.locked) { const l = document.createElement('span'); l.className = 'lock'; l.textContent = 'PIN'; b.append(l) }
      b.onclick = () => {
        if (!p.locked) return go(p.id)
        picked = p.id
        for (const other of list.children) other.setAttribute('aria-pressed', String(other === b))
        form.hidden = false; wrong.textContent = ''; code.value = ''; code.focus()
      }
      list.append(b)
      if (p.id === last) { b.focus(); if (p.locked && profiles.length === 1) b.click() }
    }
  })
  code.oninput = () => { open.disabled = !/^\d{4,12}$/.test(code.value) }
  form.onsubmit = (e) => { e.preventDefault(); if (picked) go(picked, code.value) }
</script>
</body>
</html>

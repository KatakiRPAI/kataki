<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kataki · Settings, Shortcuts</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kataki/tokens.css">
<link rel="stylesheet" href="ds/kataki/components/bundle.css">
<link rel="stylesheet" href="app/app.css">
<script src="ds/kataki/components/bundle.js"></script>
<script src="app/app.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}.sc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.recording{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--raise);border:1px solid var(--accent);border-radius:var(--radius-md);margin:6px}</style>
</helmet>
<div data-theme="{{theme}}" class="app" style="height: 1100px;">
  <div class="app__sky"><x-import component-from-global-scope="Kataki.Sky" clouds="{{no}}" style="position: absolute; inset: 0px;"></x-import></div>
  <x-import component-from-global-scope="Kataki.Rail" active="Settings" theme="{{theme}}" hrefs="{{hrefs}}" on-navigate="{{nav}}" height="{{h}}"></x-import>
  <main class="app__main" aria-label="Settings" style="gap: 24px;">
    <x-import component-from-global-scope="Kataki.TopBar" who="liv" name="Liv"></x-import>
    <h1 class="pg-title">Settings</h1>
    <div class="set">
      <x-import component-from-global-scope="Kataki.SideNav" label="Settings" active="Shortcuts" items="{{navItems}}" footer="{{whatsNew}}"></x-import>
      <div class="set__panel" style="max-width: 960px;">
        <div class="row" style="justify-content: space-between;">
          <span class="t-body">Every one of these can be changed: click it and press the new keys. Nothing in Kataki needs a mouse.</span>
          <div class="row" style="gap: 10px;"><div style="width: 240px;"><x-import component-from-global-scope="Kataki.SearchField" placeholder="Find a shortcut" label="Find a shortcut" shortcut="{{no}}"></x-import></div><x-import component-from-global-scope="Kataki.Button" size="sm" variant="ghost" icon="refresh">Reset all</x-import></div>
        </div>
        <sc-if value="{{remap}}" hint-placeholder-val="{{false}}">
          <x-import component-from-global-scope="Kataki.Callout" tone="warm" title="Ctrl R already regenerates the last reply" action="{{swapAction}}">Use it for Reading mode instead, and leave Regenerate without a shortcut? SHORTCUT_TAKEN</x-import>
        </sc-if>
        <div class="sc-grid">
          <div class="col" style="gap: 20px;">
            <x-import component-from-global-scope="Kataki.SettingsSection" title="Anywhere">
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Search everything" keys="{{k.search}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="New story" keys="{{k.newStory}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="New character" keys="{{k.newChar}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Switch persona" keys="{{k.persona}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Settings" keys="{{k.settings}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Focus the search on a page" keys="{{k.slash}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Tell us something" keys="{{k.feedback}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Close whatever is open" keys="{{k.esc}}"></x-import>
            </x-import>
            <x-import component-from-global-scope="Kataki.SettingsSection" title="Moving around">
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Go to Home" keys="{{k.gh}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Go to Stories" keys="{{k.gs}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Go to Characters" keys="{{k.gc}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Go to World" keys="{{k.gw}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Go to You" keys="{{k.gy}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Next control" keys="{{k.tab}}"></x-import>
            </x-import>
          </div>
          <div class="col" style="gap: 20px;">
            <x-import component-from-global-scope="Kataki.SettingsSection" title="In a story">
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Send" keys="{{k.enter}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="New line" keys="{{k.shiftEnter}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Send and pass time" keys="{{k.ctrlEnter}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Edit your last line" keys="{{k.up}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Regenerate the last reply" keys="{{k.regen}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Stop a reply" keys="{{k.esc}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Previous · next take" keys="{{k.takes}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Continue the story" keys="{{k.cont}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Backstage" keys="{{k.bs}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Find in this story" keys="{{k.find}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Mute the music" keys="{{k.mute}}"></x-import>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Edit widgets" keys="{{k.widgets}}"></x-import>
              <sc-if value="{{notRemap}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="Kataki.ShortcutRow" label="Reading mode" keys="{{k.reading}}"></x-import></sc-if>
              <sc-if value="{{remap}}" hint-placeholder-val="{{false}}">
                <div class="recording" role="status" aria-live="polite"><span style="flex: 1; font-weight: 700;">Reading mode</span><span class="t-meta">Press the new keys…</span><x-import component-from-global-scope="Kataki.Shortcut" keys="{{k.regen}}"></x-import><x-import component-from-global-scope="Kataki.Button" size="sm" variant="ghost">Cancel</x-import></div>
              </sc-if>
              <x-import component-from-global-scope="Kataki.ShortcutRow" label="Pick up a widget · move it" keys="{{k.space}}"></x-import>
            </x-import>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"remap":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var A = window.KApp, remap = !!this.props.remap;
    return A.page(this, {
      h: 1100, remap: remap, notRemap: !remap,
      swapAction: A.el('ButtonGroup', {}, [A.btn('secondary', 'Use it here', { size: 'sm' }), A.btn('ghost', 'Pick other keys', { size: 'sm' })]),
      k: {
        search: ['Ctrl', 'K'], newStory: ['Ctrl', 'N'], newChar: ['Ctrl', 'Shift', 'N'], persona: ['Ctrl', 'P'], settings: ['Ctrl', ','], slash: ['/'], feedback: ['Ctrl', 'Shift', 'F'], esc: ['Esc'],
        gh: ['G', 'then', 'H'], gs: ['G', 'then', 'S'], gc: ['G', 'then', 'C'], gw: ['G', 'then', 'W'], gy: ['G', 'then', 'Y'], tab: ['Tab'],
        enter: ['Enter'], shiftEnter: ['Shift', 'Enter'], ctrlEnter: ['Ctrl', 'Enter'], up: ['↑'], regen: ['Ctrl', 'R'], takes: ['Alt', '←', '→'], cont: ['Ctrl', 'J'], bs: ['Ctrl', 'B'], find: ['Ctrl', 'F'], mute: ['Ctrl', 'M'], widgets: ['Ctrl', 'E'], reading: ['Ctrl', 'Shift', 'R'], space: ['Space', 'then', 'arrows']
      },
      navItems: [{ icon: 'settings', label: 'General', href: 'SetGeneral.dc.html' }, { icon: 'sun', label: 'Appearance', href: 'SetAppearance.dc.html' }, { icon: 'globe', label: 'Language', href: 'SetLanguage.dc.html' }, { icon: 'cpu', label: 'Models', href: 'SetModels.dc.html' }, { icon: 'thought', label: 'Memory and thinking', href: 'SetMemory.dc.html' }, { icon: 'shield', label: 'Data and privacy', href: 'SetData.dc.html' }, { icon: 'key', label: 'Shortcuts', href: 'SetShortcuts.dc.html' }, { icon: 'help', label: 'About', href: 'SetAbout.dc.html' }],
      whatsNew: A.el('TextLink', { icon: 'spark', href: 'SetAbout.dc.html' }, 'What’s new')
    });
  }
}
</script>
</body>
</html>

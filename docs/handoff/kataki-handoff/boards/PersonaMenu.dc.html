<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kataki · Playing as</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kataki/tokens.css">
<link rel="stylesheet" href="ds/kataki/components/bundle.css">
<link rel="stylesheet" href="app/app.css">
<script src="ds/kataki/components/bundle.js"></script>
<script src="app/app.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 1440px; height: 1360px; overflow: hidden;">
  <div class="under" aria-hidden="true"><dc-import name="Home" theme="{{theme}}" hint-size="1440px,1360px"></dc-import></div>
  <div class="ov__at" style="inset-inline-start: 240px; top: 76px; z-index: 30;">
    <x-import component-from-global-scope="Kataki.Menu" title="Playing as" width="{{w300}}" items="{{items}}" footer="Switching changes who you are in new lines. Stories you already started keep their persona."></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    return window.KApp.page(this, {
      w300: 300,
      items: [
        { who: 'liv', label: 'Liv Sandoval', meta: 'default', checked: true },
        { who: 'cas', label: 'Cas Brennan', checked: false },
        { icon: 'eye', label: 'Director · play no one', checked: false },
        { divider: true },
        { icon: 'plus', label: 'New persona' },
        { icon: 'user', label: 'Manage personas' }
      ]
    });
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kataki · Command palette, nothing typed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kataki/tokens.css">
<link rel="stylesheet" href="ds/kataki/components/bundle.css">
<link rel="stylesheet" href="app/app.css">
<script src="ds/kataki/components/bundle.js"></script>
<script src="app/app.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 1440px; height: 1360px; overflow: hidden;">
  <div class="under" aria-hidden="true"><dc-import name="Home" theme="{{theme}}" hint-size="1440px,1360px"></dc-import></div>
  <div class="ov">
    <div class="ov__dim"></div>
    <div class="ov__win ov__win--top">
      <x-import component-from-global-scope="Kataki.CommandPalette" query="" groups="{{groups}}"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    return window.KApp.page(this, {
      groups: [
        { title: 'Recent', items: [
          { icon: 'chat', label: 'Two Sugars, No Title', story: true, meta: 'story · played 2 hours ago', active: true },
          { who: 'mike', label: 'Mike', story: true, meta: 'character' },
          { icon: 'map-pin', label: 'Halcyon Coffee', story: true, meta: 'place' } ] },
        { title: 'Do', items: [
          { icon: 'plus', label: 'New story', shortcut: ['Ctrl', 'N'] },
          { icon: 'feather', label: 'New character' },
          { icon: 'swap', label: 'Switch persona', shortcut: ['Ctrl', 'P'] },
          { icon: 'download', label: 'Import cards' },
          { icon: 'cog', label: 'Settings', shortcut: ['Ctrl', ','] },
          { icon: 'help', label: 'Give feedback' } ] },
        { title: 'Go to', items: [
          { icon: 'home', label: 'Home', shortcut: ['G', 'then', 'H'] },
          { icon: 'chat', label: 'Stories', shortcut: ['G', 'then', 'S'] },
          { icon: 'users', label: 'Characters', shortcut: ['G', 'then', 'C'] } ] }
      ]
    });
  }
}
</script>
</body>
</html>

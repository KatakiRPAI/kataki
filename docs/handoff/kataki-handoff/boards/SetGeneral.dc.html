<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kataki · Settings, General</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kataki/tokens.css">
<link rel="stylesheet" href="ds/kataki/components/bundle.css">
<link rel="stylesheet" href="app/app.css">
<script src="ds/kataki/components/bundle.js"></script>
<script src="app/app.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" class="app" style="height: 1000px;">
  <div class="app__sky"><x-import component-from-global-scope="Kataki.Sky" clouds="{{no}}" style="position: absolute; inset: 0px;"></x-import></div>
  <x-import component-from-global-scope="Kataki.Rail" active="Settings" theme="{{theme}}" hrefs="{{hrefs}}" on-navigate="{{nav}}" height="{{h}}"></x-import>
  <main class="app__main" aria-label="Settings" style="gap: 24px;">
    <x-import component-from-global-scope="Kataki.TopBar" who="liv" name="Liv"></x-import>
    <h1 class="pg-title">Settings</h1>
    <div class="set">
      <x-import component-from-global-scope="Kataki.SideNav" label="Settings" active="General" items="{{navItems}}" footer="{{whatsNew}}"></x-import>
      <div class="set__panel">
        <x-import component-from-global-scope="Kataki.SettingsSection" title="General" note="How Kataki behaves when it opens and while it runs.">
          <x-import component-from-global-scope="Kataki.SettingsRow" title="When Kataki opens" description="Go straight back into the last scene, or stop at Home first."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{opens}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Autosave" description="Every line is written to disk as it arrives. This can’t be turned off."><x-import component-from-global-scope="Kataki.StatePill" tone="ok" icon="check">Always on</x-import></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Keep a history of edits" description="Lets you go back to an earlier take or edit days later. Costs disk space."><div class="row" style="gap: 12px;"><div style="width: 150px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{keepFor}}"></x-import></div><x-import component-from-global-scope="Kataki.Toggle" default-on="{{yes}}" label="Keep a history of edits"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Check for updates" description="Kataki asks one version endpoint for a number. No account, no identifier, nothing about your stories."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{updates}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Start with Windows" description="Opens quietly to the tray when you sign in."><x-import component-from-global-scope="Kataki.Toggle" label="Start with Windows"></x-import></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Closing the window" description="What the × does. The tray icon can always quit."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{closeOpts}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Send anonymous usage data" description="Off, and there is no code in Kataki that can turn it on."><x-import component-from-global-scope="Kataki.StatePill" tone="muted" icon="shield">Not collected</x-import></x-import>
        </x-import>
        <x-import component-from-global-scope="Kataki.SettingsSection" title="Story defaults" note="What a new story starts with. Each story can change all of it in Story settings.">
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Default persona" description="Who you play when you don’t pick someone."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{personas}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Composer mode" description="Auto reads how you write. Say, Do, Whisper, Think and Narrate override it."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{modes}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Show who hears what" description="Opens the composer in Advanced. Off by default."><x-import component-from-global-scope="Kataki.Toggle" label="Show who hears what"></x-import></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Music" description="Match the scene, keep one track, or stay quiet."><div style="width: 200px;"><x-import component-from-global-scope="Kataki.Select" label="" options="{{music}}"></x-import></div></x-import>
          <x-import component-from-global-scope="Kataki.SettingsRow" title="Music volume" description="Mute is always one click away on the music widget, and Ctrl M."><div style="width: 220px;"><x-import component-from-global-scope="Kataki.Slider" label="Music volume" default-value="{{v62}}" value-text="62%"></x-import></div></x-import>
        </x-import>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var A = window.KApp;
    return A.page(this, {
      h: 1000, v62: 62,
      navItems: [{ icon: 'settings', label: 'General', href: 'SetGeneral.dc.html' }, { icon: 'sun', label: 'Appearance', href: 'SetAppearance.dc.html' }, { icon: 'globe', label: 'Language', href: 'SetLanguage.dc.html' }, { icon: 'cpu', label: 'Models', href: 'SetModels.dc.html' }, { icon: 'thought', label: 'Memory and thinking', href: 'SetMemory.dc.html' }, { icon: 'shield', label: 'Data and privacy', href: 'SetData.dc.html' }, { icon: 'key', label: 'Shortcuts', href: 'SetShortcuts.dc.html' }, { icon: 'help', label: 'About', href: 'SetAbout.dc.html' }],
      whatsNew: A.el('TextLink', { icon: 'spark', href: 'SetAbout.dc.html' }, 'What’s new'),
      opens: ['Home', 'The last scene'], keepFor: ['30 days', '90 days', 'Forever'], updates: ['Weekly', 'Daily', 'Never'],
      closeOpts: ['Quits Kataki', 'Keeps it in the tray'], personas: ['Liv Sandoval', 'Cas Brennan', 'Director · play no one'],
      modes: ['Auto', 'Say', 'Do', 'Whisper', 'Think', 'Narrate'], music: ['Match the scene', 'Keep one track', 'Quiet']
    });
  }
}
</script>
</body>
</html>
